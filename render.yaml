# One-click backend deploy on Render (Blueprint). Frontend → Vercel (root dir: frontend).
services:
  - type: web
    name: mach-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
